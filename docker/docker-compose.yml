services:

  # ═══════════════════════════════════════════════════════════════════════════
  # Rocky Linux 9  —  Web POC (recommended)
  # ═══════════════════════════════════════════════════════════════════════════

  # ── Full USD backend + web server (NO Qt) ───────────────────────────────────
  # Full OpenUSD 23.05 compiled from source with:
  #   Hydra, Alembic, MaterialX, OCIO, OIIO, OpenSubdiv, Embree, OSL
  # UI runs entirely in the browser — Qt is NOT needed.
  #
  # Build:  docker compose build rocky9
  # Start:  docker compose up rocky9
  # URL:    http://localhost:8080
  rocky9:
    build:
      context: ../..
      dockerfile: OpenDCC/docker/Dockerfile.rocky9
      target: runtime
    image: opendcc:rocky9
    container_name: opendcc-rocky9
    ports:
      - "8080:8080"
    volumes:
      - type: bind
        source: ${USD_STAGES_PATH:-./stages}
        target: /data/stages
    environment:
      - USD_VIEWER_PATH=/opt/usd-viewer
      - OPENDCC_STAGES_ROOT=/data/stages
      - TF_DEBUG=0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Full USD backend + GPU passthrough ──────────────────────────────────────
  # Same as rocky9 but with NVIDIA GPU for Hydra/Storm headless rendering.
  # Requires: nvidia-container-toolkit on host.
  #
  # Build:  docker compose build rocky9  (reuses same image)
  # Start:  docker compose up rocky9-gpu
  rocky9-gpu:
    image: opendcc:rocky9
    container_name: opendcc-rocky9-gpu
    ports:
      - "8081:8080"
    volumes:
      - type: bind
        source: ${USD_STAGES_PATH:-./stages}
        target: /data/stages
    environment:
      - USD_VIEWER_PATH=/opt/usd-viewer
      - OPENDCC_STAGES_ROOT=/data/stages
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Lightweight web-only (no C++ build, pip usd-core) ──────────────────────
  # Ultra-fast build (~3 min). Good for frontend dev / testing.
  # USD Python from pip (limited features vs compiled).
  #
  # Build:  docker compose build rocky9-web
  # Start:  docker compose up rocky9-web
  # URL:    http://localhost:8082
  rocky9-web:
    build:
      context: ../..
      dockerfile: OpenDCC/docker/Dockerfile.rocky9.web
    image: opendcc-web:rocky9
    container_name: opendcc-rocky9-web
    ports:
      - "8082:8080"
    volumes:
      - type: bind
        source: ${USD_STAGES_PATH:-./stages}
        target: /data/stages
    environment:
      - USD_VIEWER_PATH=/opt/usd-viewer
      - OPENDCC_STAGES_ROOT=/data/stages
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes: {}
