<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenDCC Web</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%235a8fc2'/><text x='16' y='23' font-size='20' text-anchor='middle' fill='white' font-family='system-ui' font-weight='bold'>D</text></svg>">

  <!--
    Import map – must use THREE r163 to match ThreeJsRenderDelegate.js imports.
    Natively supported in Chrome 89+, Firefox 108+, Safari 16.4+.
  -->
  <script type="importmap">
  {
    "imports": {
      "three":         "https://unpkg.com/three@0.163.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.163.0/examples/jsm/"
    }
  }
  </script>

  <!--
    Eagerly download three.js so the module cache is warm before the render
    delegate tries to import it. This shaves ~300 ms off first load.
  -->
  <script type="module" src="https://unpkg.com/three@0.163.0/build/three.module.js"></script>

  <style>
    /* ── Reset ─────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #2a2a2a;
      --bg2:       #333;
      --bg3:       #3d3d3d;
      --border:    #555;
      --text:      #d0d0d0;
      --text2:     #999;
      --accent:    #5a8fc2;
      --accent2:   #3a6f9f;
      --danger:    #c25a5a;
      --success:   #5ac274;
      --panel:     #282828;
      --header-h:  38px;
      --toolbar-h: 34px;
      --status-h:  22px;
    }

    html, body {
      height: 100%; width: 100%;
      background: var(--bg); color: var(--text);
      font: 12px/1.5 "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
    }

    /* ── App grid ─────────────────────────────────────────────────────── */
    #app {
      display: grid;
      grid-template-rows: var(--header-h) var(--toolbar-h) 1fr var(--status-h);
      grid-template-columns: 220px 1fr 260px;
      height: 100vh;
    }

    /* Header */
    #header {
      grid-column: 1 / -1;
      display: flex; align-items: center; gap: 10px; padding: 0 12px;
      background: #1e1e1e; border-bottom: 1px solid var(--border);
      user-select: none;
    }
    #header .logo    { font-weight: 700; font-size: 13px; color: var(--accent); letter-spacing:.5px }
    #header .version { font-size: 10px; color: var(--text2); }
    #header .spacer  { flex: 1; }

    /* Toolbar */
    #toolbar {
      grid-column: 1 / -1;
      display: flex; align-items: center; gap: 6px; padding: 0 10px;
      background: var(--bg2); border-bottom: 1px solid var(--border);
    }
    #toolbar label { font-size: 11px; color: var(--text2); margin-left: 6px; }
    #toolbar select {
      background: var(--bg3); border: 1px solid var(--border);
      color: var(--text); font-size: 11px; padding: 2px 4px; border-radius: 3px;
    }

    /* Panels */
    #outliner, #properties {
      background: var(--panel); display: flex; flex-direction: column; overflow: hidden;
    }
    #outliner  { border-right: 1px solid var(--border); }
    #properties{ border-left:  1px solid var(--border); }

    .panel-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 5px 8px;
      background: var(--bg3); border-bottom: 1px solid var(--border);
      font-size: 11px; font-weight: 600; letter-spacing: .3px;
      user-select: none; flex-shrink: 0;
    }
    .scroll { flex: 1; overflow-y: auto; }
    .scroll::-webkit-scrollbar { width: 6px; }
    .scroll::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }

    /* Viewport */
    #viewport-wrap {
      position: relative; background: #0e0e0e; overflow: hidden;
    }
    /* Three.js renderer appends its canvas to #viewport-wrap */
    #viewport-wrap canvas {
      display: block; position: absolute; inset: 0;
    }

    /* Loading / status overlay */
    #vp-overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      pointer-events: none; z-index: 10;
    }
    #vp-msg {
      color: var(--text2); font-size: 11px; text-align: center;
      background: rgba(0,0,0,.5); padding: 8px 14px; border-radius: 4px;
      max-width: 320px; line-height: 1.6;
    }
    .progress-bar {
      width: 220px; height: 4px; background: #333; border-radius: 2px; margin-top: 8px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: var(--accent); border-radius: 2px;
      transition: width .15s ease; width: 0%;
    }

    /* Prim tree */
    #prim-tree { padding: 4px 0; font-size: 11px; }
    .prim-row {
      display: flex; align-items: center; gap: 4px;
      padding: 2px 6px;
      padding-left: calc(6px + var(--depth,0) * 12px);
      cursor: pointer; white-space: nowrap;
    }
    .prim-row:hover    { background: rgba(90,143,194,.2); }
    .prim-row.selected { background: rgba(90,143,194,.4); }
    .prim-toggle { font-size: 9px; color: var(--text2); width: 12px; }
    .prim-type   { color: var(--text2); font-size: 10px; }

    /* Properties */
    #attr-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    #attr-table td {
      padding: 3px 8px; border-bottom: 1px solid #3a3a3a; vertical-align: top;
    }
    #attr-table td:first-child { color: var(--text2); width: 38%; }
    #attr-table tr:hover td    { background: rgba(255,255,255,.04); }
    .attr-editable { cursor: text; }
    .attr-editable:hover { background: rgba(90,143,194,.15) !important; }
    .attr-input {
      width: 100%; background: #222; border: 1px solid var(--accent);
      color: var(--text); font: 11px monospace; padding: 1px 4px;
    }

    /* Script overlay */
    #script-panel {
      position: absolute; inset: 0;
      background: rgba(20,20,20,.97);
      display: none; flex-direction: column; z-index: 20;
    }
    #script-panel.open { display: flex; }
    #script-editor {
      flex: 1; background: #1e1e1e; color: #d4d4d4;
      border: none; resize: none;
      font: 13px/1.5 "Fira Code", "Cascadia Code", monospace;
      padding: 10px; outline: none;
    }
    #script-output {
      height: 120px; background: #111; color: #aaa;
      font: 11px/1.4 "Fira Code", monospace;
      padding: 6px 10px; overflow-y: auto;
      border-top: 1px solid var(--border); white-space: pre;
    }

    /* Open modal */
    #open-modal {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.6); z-index: 200;
      align-items: center; justify-content: center;
    }
    #open-modal.open { display: flex; }
    #open-modal .box {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 6px; padding: 20px; width: 440px;
    }
    #open-modal h3 { margin-bottom: 12px; font-size: 13px; }

    /* Status bar */
    #statusbar {
      grid-column: 1 / -1;
      display: flex; align-items: center; gap: 10px; padding: 0 10px;
      background: #1a1a1a; border-top: 1px solid var(--border);
      font-size: 10px; color: var(--text2);
    }
    .ws-dot {
      width: 7px; height: 7px; border-radius: 50%; background: #777; flex-shrink: 0;
      transition: background .3s;
    }
    .ws-dot.ok    { background: var(--success); }
    .ws-dot.error { background: var(--danger);  }

    /* Shared controls */
    button {
      padding: 3px 10px;
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: 3px; color: var(--text); font: 11px system-ui;
      cursor: pointer; transition: background .1s;
    }
    button:hover   { background: #4a4a4a; }
    button:active  { background: var(--accent2); }
    button.primary { background: var(--accent2); border-color: var(--accent); }
    button.primary:hover { background: var(--accent); }

    input[type="text"] {
      background: var(--bg); border: 1px solid var(--border);
      color: var(--text); border-radius: 3px; padding: 3px 7px; font: 11px system-ui;
      width: 100%;
    }
    input[type="text"]:focus { outline: none; border-color: var(--accent); }
    input[type="text"] { margin-bottom: 10px; }
  </style>
</head>
<body>

<div id="app">

  <!-- ── Header ─────────────────────────────────────────────────────────── -->
  <div id="header">
    <span class="logo">OpenDCC</span>
    <span class="version" id="dcc-version">web</span>
    <span class="spacer"></span>
    <button onclick="openStageModal()">Open Stage…</button>
    <button onclick="newStage()">New</button>
    <button onclick="saveStage()">Save</button>
    <button onclick="toggleScript()">Script Editor</button>
  </div>

  <!-- ── Toolbar ────────────────────────────────────────────────────────── -->
  <div id="toolbar">
    <label>Stage:</label>
    <span id="stage-label" style="color:var(--text2);font-size:11px;margin-left:4px">—</span>
    <span style="flex:1"></span>
    <button onclick="frameAll() || (_pendingFrame=true)" title="Frame all (F)">⊡ Frame</button>
    <button onclick="reloadStage()" title="Reload USD from server">↻ Reload</button>
  </div>

  <!-- ── Outliner ───────────────────────────────────────────────────────── -->
  <div id="outliner">
    <div class="panel-header">
      Outliner
      <button style="padding:1px 6px;font-size:10px" onclick="refreshPrims()">↻</button>
    </div>
    <div class="scroll">
      <div id="prim-tree">
        <span style="color:var(--text2);padding:8px;display:block">No stage loaded</span>
      </div>
    </div>
  </div>

  <!-- ── Viewport ───────────────────────────────────────────────────────── -->
  <div id="viewport-wrap">
    <!-- Three.js canvas is appended here by the module script -->

    <!-- Loading overlay -->
    <div id="vp-overlay">
      <div id="vp-msg">
        Loading USD WASM…<br/>
        <small style="color:#777">(~17 MB on first visit, cached after that)</small>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>
    </div>

    <!-- Script editor (overlaid on viewport) -->
    <div id="script-panel">
      <div class="panel-header" style="padding:6px 10px">
        Python Script Editor
        <div style="display:flex;gap:6px">
          <button class="primary" onclick="runScript()">▶ Run</button>
          <button onclick="clearScript()">Clear</button>
          <button onclick="toggleScript()">✕</button>
        </div>
      </div>
      <textarea id="script-editor" spellcheck="false"
        placeholder="# Globals: app, session, stage&#10;from pxr import UsdGeom&#10;for p in stage.TraverseAll():&#10;    print(p.GetPath(), p.GetTypeName())"></textarea>
      <div id="script-output"></div>
    </div>
  </div>

  <!-- ── Properties ─────────────────────────────────────────────────────── -->
  <div id="properties">
    <div class="panel-header">Properties</div>
    <div class="scroll" id="props-scroll">
      <div id="prim-info" style="padding:8px;font-size:11px;color:var(--text2)">
        Select a prim to inspect
      </div>
      <table id="attr-table"><tbody id="attr-body"></tbody></table>
    </div>
  </div>

  <!-- ── Status bar ─────────────────────────────────────────────────────── -->
  <div id="statusbar">
    <div class="ws-dot" id="ws-dot"></div>
    <span id="ws-label">Connecting…</span>
    <span style="flex:1"></span>
    <span id="vp-stats" style="color:var(--text2)"></span>
    <span id="status-msg"></span>
  </div>

</div><!-- #app -->

<!-- Open stage modal -->
<div id="open-modal">
  <div class="box">
    <h3>Open USD Stage</h3>
    <input type="text" id="stage-path-input"
           placeholder="/data/scenes/kitchen.usda"
           onkeydown="if(event.key==='Enter') confirmOpenStage()" />
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button onclick="document.getElementById('open-modal').classList.remove('open')">Cancel</button>
      <button class="primary" onclick="confirmOpenStage()">Open</button>
    </div>
  </div>
</div>

<!-- ════════════════════════════════════════════════════════════════════════
     THREE.JS  +  USD-WASM VIEWPORT
     ════════════════════════════════════════════════════════════════════ -->
<script type="module">
import * as THREE       from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// USD WASM: side-effect import registers globalThis["NEEDLE:USD:GET"]
import '/usd/bindings/emHdBindings.js';

// Hydra → Three.js render delegate
import { ThreeRenderDelegateInterface }
  from '/usd/hydra/ThreeJsRenderDelegate.js';

// ── Viewport container ────────────────────────────────────────────────────
const vpWrap = document.getElementById('viewport-wrap');

// ── Three.js renderer ─────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping      = THREE.NeutralToneMapping;
renderer.shadowMap.enabled = false;
renderer.setClearColor(0x111111, 1);
vpWrap.appendChild(renderer.domElement);

// ── Scene ─────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();

const usdRoot = new THREE.Group();
usdRoot.name  = "USD Root";
scene.add(usdRoot);

scene.add(new THREE.GridHelper(20, 20, 0x444444, 0x333333));

// ── Default lights (fallback when USD scene has no UsdLux lights) ─────────
const _keyLight = new THREE.DirectionalLight(0xffffff, 1.8);
_keyLight.position.set(5, 10, 7);
scene.add(_keyLight);
const _fillLight = new THREE.DirectionalLight(0x8899bb, 0.6);
_fillLight.position.set(-4, 6, -3);
scene.add(_fillLight);
scene.add(new THREE.AmbientLight(0x404050, 0.5));
scene.add(new THREE.HemisphereLight(0xb0c0d0, 0x303030, 0.4));

// ── Camera + controls ─────────────────────────────────────────────────────
const camera = new THREE.PerspectiveCamera(27, 1, 0.01, 100000);
camera.position.set(7, 7, 7);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping      = true;
controls.dampingFactor      = 0.08;
controls.screenSpacePanning = true;

// ── Resize ────────────────────────────────────────────────────────────────
function resizeViewport() {
  const w = vpWrap.clientWidth, h = vpWrap.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resizeViewport).observe(vpWrap);
resizeViewport();

// ── Frame all ─────────────────────────────────────────────────────────────
window.frameAll = function () {
  // Collect bounding box ONLY from mesh objects inside usdRoot
  // (avoids helper objects, empty groups, cameras, etc.)
  const box = new THREE.Box3();
  let hasMesh = false;
  usdRoot.traverse(obj => {
    if (obj.isMesh && obj.geometry) {
      obj.geometry.computeBoundingBox();
      const meshBox = obj.geometry.boundingBox.clone();
      meshBox.applyMatrix4(obj.matrixWorld);
      box.expandByObject(obj);
      hasMesh = true;
    }
  });
  if (!hasMesh || box.isEmpty()) return false;

  const size   = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  if (isNaN(size.x) || size.length() === 0) return false;

  // Bounding sphere radius (half-diagonal of the AABB)
  const radius = size.length() * 0.5;

  // Distance that fits the bounding sphere inside the vertical FOV
  // with a 1.6× comfort margin so the object doesn't touch the edges.
  const vFov = camera.fov * (Math.PI / 180);
  const dist = (radius / Math.tan(vFov / 2)) * 1.6;

  controls.target.copy(center);
  // Position: offset at ~45° azimuth + ~30° elevation
  camera.position.copy(center).add(
    new THREE.Vector3(dist * 0.66, dist * 0.45, dist * 0.66)
  );
  camera.near = Math.max(0.01, dist / 500);
  camera.far  = dist * 200;
  camera.updateProjectionMatrix();
  controls.maxDistance = dist * 20;
  controls.update();
  console.log('[frameAll] OK — center:', center.toArray().map(v=>v.toFixed(2)),
              'radius:', radius.toFixed(2), 'dist:', dist.toFixed(2));
  return true;
};

document.addEventListener('keydown', e => {
  if (e.key === 'f' || e.key === 'F') window.frameAll();
});

// ── USD state ─────────────────────────────────────────────────────────────
let _driver      = null;
let _usdReady    = false;
let _endTimeCode = 1;
let _timeout     = 40;          // ms per time-code (1000 / timecodes-per-sec)
let _pendingFrame = false;      // set true → animate loop will frameAll after next Draw()

// Virtual FS path inside the WASM runtime – must end in .usda so SDF
// can determine the file format without an HTTP round-trip.
const STAGE_VPATH = '/scene.usda';

// ── Initialise USD WASM module ────────────────────────────────────────────
const getUsdModule = globalThis["NEEDLE:USD:GET"];
let USD = null;

setVpMsg("Loading USD WASM…\n(~17 MB on first visit, cached after that)");
try {
  USD = await getUsdModule({
    mainScriptUrlOrBlob: "/usd/bindings/emHdBindings.js",
    locateFile: (file) => "/usd/bindings/" + file,
    onDownloadProgress: (downloaded, total) => {
      const pct = total > 0 ? Math.round(downloaded / total * 100) : 0;
      document.getElementById('progress-fill').style.width = pct + '%';
      setVpMsg(`Loading USD WASM… ${pct}%`);
    },
  });
  setVpMsg("WASM loaded. Fetching stage…");
} catch (err) {
  setVpMsg("❌ WASM failed to load:\n" + err.message, true);
  console.error("USD WASM load error:", err);
}

// ── Load / reload the USD stage ───────────────────────────────────────────
// Strategy (mirrors usd-viewer drag-and-drop handler):
//   1. fetch fresh USDA from server (no-store → always latest)
//   2. write bytes into the WASM virtual FS at STAGE_VPATH
//   3. open STAGE_VPATH with HdWebSyncDriver
// Passing a local virtual path (not an HTTP URL) means USD's SDF layer
// format detection just looks at the ".usda" extension – no query strings,
// no network layer inside WASM, no format-detection failure.
async function loadStage(reframe = true) {
  if (!USD) { setVpMsg("USD WASM not available", true); return; }

  _usdReady = false;
  _pendingFrame = reframe;
  setVpMsg("Fetching stage…");

  // Tear down previous driver
  if (_driver) {
    try { _driver.delete(); } catch (_) {}
    _driver = null;
  }
  usdRoot.clear();

  // Remove previous virtual file so createDataFile doesn't throw EEXIST
  try { USD.FS_unlink(STAGE_VPATH); } catch (_) {}

  // ── Step 1: fetch USDA ────────────────────────────────────────────────
  let usda;
  try {
    const r = await fetch('/api/stage/export.usda', { cache: 'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status} ${r.statusText}`);
    usda = await r.text();
  } catch (err) {
    setVpMsg("❌ Failed to fetch stage:\n" + err.message, true);
    return;
  }

  // ── Step 2: write into WASM virtual FS ───────────────────────────────
  try {
    const bytes = new TextEncoder().encode(usda);
    USD.FS_createDataFile('/', 'scene.usda', bytes, true, true, true);
  } catch (err) {
    setVpMsg("❌ WASM FS write failed:\n" + err.message, true);
    console.error("FS_createDataFile error:", err);
    return;
  }

  // ── Step 3: open with HdWebSyncDriver ────────────────────────────────
  const delegateConfig = { usdRoot, paths: [], driver: () => _driver };
  try {
    const renderInterface = new ThreeRenderDelegateInterface(delegateConfig);
    let drv = new USD.HdWebSyncDriver(renderInterface, STAGE_VPATH);
    if (drv instanceof Promise) drv = await drv;
    _driver = drv;
    _driver.Draw();

    let stage = _driver.GetStage();
    if (stage instanceof Promise) stage = await stage;

    // Coordinate system: Z-up USD → Y-up Three.js
    usdRoot.rotation.x =
      String.fromCharCode(stage.GetUpAxis?.() ?? 89) === 'z'   // 'Y'=89
        ? -Math.PI / 2 : 0;

    if (stage.GetEndTimeCode)        _endTimeCode = stage.GetEndTimeCode();
    if (stage.GetTimeCodesPerSecond) _timeout     = 1000 / stage.GetTimeCodesPerSecond();

    _usdReady = true;
    hideVpMsg();

    // Fix face ordering: force double-sided on all Hydra-generated meshes
    usdRoot.traverse(obj => {
      if (obj.isMesh && obj.material) {
        const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
        mats.forEach(m => { m.side = THREE.DoubleSide; m.needsUpdate = true; });
      }
    });

    if (!_pendingFrame && reframe) _pendingFrame = true;

    setStatus("Stage loaded.");
    if (typeof refreshPrims === 'function') refreshPrims();
  } catch (err) {
    setVpMsg("❌ Stage load error:\n" + err.message, true);
    console.error("loadStage error:", err);
  }
}

window.reloadStage     = loadStage;
window.refreshViewport = loadStage;

// ── Animation / render loop ───────────────────────────────────────────────
let _animTime  = 0;
let _prevTime  = performance.now();
let _frameCount = 0;
let _lastFpsTs  = performance.now();

function animate() {
  requestAnimationFrame(animate);
  controls.update();

  const now = performance.now();
  const dt  = (now - _prevTime) * 0.001;
  _prevTime = now;

  if (_driver && _usdReady) {
    _animTime += dt;
    const tc = (_animTime * (1000 / _timeout)) % _endTimeCode;
    _driver.SetTime(tc);
    _driver.Draw();

    // Frame the scene AFTER Draw() populates the Three.js scene graph.
    // Hydra WASM is async — meshes only appear in usdRoot after Draw().
    if (_pendingFrame) {
      if (window.frameAll()) {
        _pendingFrame = false;
      }
    }
  }

  renderer.render(scene, camera);

  _frameCount++;
  if (now - _lastFpsTs >= 1000) {
    document.getElementById('vp-stats').textContent =
      `${_frameCount} fps  |  ${renderer.info.render.triangles.toLocaleString()} tris`;
    _frameCount = 0;
    _lastFpsTs  = now;
    renderer.info.reset();
  }
}
animate();

// ── Overlay helpers ───────────────────────────────────────────────────────
function setVpMsg(text, isError = false) {
  const el = document.getElementById('vp-msg');
  el.textContent = text;
  el.style.color = isError ? 'var(--danger)' : 'var(--text2)';
  document.getElementById('vp-overlay').style.display = 'flex';
}
function hideVpMsg() {
  document.getElementById('vp-overlay').style.display = 'none';
}

// ── Kick off ──────────────────────────────────────────────────────────────
if (USD) loadStage(true);   // initial load — always frame the scene

// ── Expose to plain-script half of the page ───────────────────────────────
window._threeScene    = scene;
window._threeRenderer = renderer;
window._threeCamera   = camera;
window._threeControls = controls;
window._usdRoot       = usdRoot;
</script>

<!-- ════════════════════════════════════════════════════════════════════════
     APP LOGIC  (REST / WebSocket / Outliner / Properties — plain script)
     ════════════════════════════════════════════════════════════════════ -->
<script>
// ── REST helper ───────────────────────────────────────────────────────────
async function api(url, method = 'GET', body = null) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  try {
    const r = await fetch(url, opts);
    if (!r.ok) { setStatus('Error: ' + (await r.text()), true); return {}; }
    return await r.json();
  } catch (e) { setStatus('Network: ' + e.message, true); return {}; }
}

// ── WebSocket ─────────────────────────────────────────────────────────────
let ws = null;
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen  = () => setWS('Connected', true);
  ws.onclose = () => { setWS('Disconnected', false); setTimeout(connectWS, 3000); };
  ws.onerror = () => setWS('Error', false, true);
  ws.onmessage = ({ data }) => {
    const msg = JSON.parse(data);

    if (msg.event === 'connected') {
      const v = msg.opendcc ? 'OpenDCC ✓' : 'stub mode';
      document.getElementById('dcc-version').textContent = v;
      if (!msg.usd_wasm)
        setStatus('⚠ usd-wasm not found – clone needle-tools/usd-viewer next to OpenDCC', true);
    }
    if (msg.event === 'scene_changed') {
      setStatus('Stage changed – reloading…');
      // Incremental edit — reload scene but don't reset camera
      if (typeof window.reloadStage === 'function') window.reloadStage(false);
      refreshPrims();
    }
    if (msg.event === 'stage_opened') {
      document.getElementById('stage-label').textContent = msg.path || '[stage]';
      setStatus('Opened: ' + msg.path);
      // New stage opened — reload and reframe
      if (typeof window.reloadStage === 'function') window.reloadStage(true);
      refreshPrims();
    }
    if (msg.event === 'stage_new') {
      document.getElementById('stage-label').textContent = '[new]';
      if (typeof window.reloadStage === 'function') window.reloadStage(true);
    }
    if (msg.event === 'script_executed') {
      setStatus(msg.ok ? 'Script OK.' : 'Script error – see output.');
    }
  };
}

function setWS(label, ok, err = false) {
  const dot = document.getElementById('ws-dot');
  dot.className = 'ws-dot' + (ok ? ' ok' : err ? ' error' : '');
  document.getElementById('ws-label').textContent = label;
}

// ── Stage actions ─────────────────────────────────────────────────────────
function openStageModal() {
  document.getElementById('open-modal').classList.add('open');
  document.getElementById('stage-path-input').focus();
}
async function confirmOpenStage() {
  const p = document.getElementById('stage-path-input').value.trim();
  if (!p) return;
  document.getElementById('open-modal').classList.remove('open');
  await api('/api/stage/open', 'POST', { path: p });
}
async function newStage()  { await api('/api/stage/new',  'POST', {}); }
async function saveStage() { await api('/api/stage/save', 'POST', {}); setStatus('Saved.'); }

window.openStageModal   = openStageModal;
window.confirmOpenStage = confirmOpenStage;
window.newStage         = newStage;
window.saveStage        = saveStage;

// ── Outliner ──────────────────────────────────────────────────────────────
async function refreshPrims() {
  const d = await api('/api/prims?path=/');
  const tree = document.getElementById('prim-tree');
  tree.innerHTML = '';
  if (!d.children?.length) {
    tree.innerHTML = '<span style="color:var(--text2);padding:8px;display:block">Empty stage</span>';
    return;
  }
  renderPrimRows(tree, d.children, 0);

  // Auto-expand first level (e.g. /World → show its children)
  for (const prim of d.children) {
    if (prim.children.length) {
      const row = tree.querySelector(`[data-path="${prim.path}"]`);
      if (row && !row.dataset.expanded) {
        row.dataset.expanded = '1';
        const toggle = row.querySelector('.prim-toggle');
        if (toggle) toggle.textContent = '▾';
        const d2 = await api(`/api/prims?path=${encodeURIComponent(prim.path)}`);
        if (d2.children) renderPrimRows(tree, d2.children, 1);
      }
    }
  }
}
window.refreshPrims = refreshPrims;

function renderPrimRows(container, children, depth) {
  children.forEach(prim => {
    const row = document.createElement('div');
    row.className  = 'prim-row';
    row.style.setProperty('--depth', depth);
    row.dataset.path = prim.path;

    const arrow = prim.children.length
      ? '<span class="prim-toggle">▸</span>'
      : '<span class="prim-toggle">&nbsp;</span>';

    row.innerHTML = arrow
      + `<span>${primIcon(prim.type)}&nbsp;${prim.name}</span>`
      + `<span class="prim-type">&nbsp;${prim.type || ''}</span>`;

    row.addEventListener('click', async (ev) => {
      ev.stopPropagation();
      // Select
      document.querySelectorAll('.prim-row.selected').forEach(r => r.classList.remove('selected'));
      row.classList.add('selected');
      selectPrimByPath(prim.path);

      // Lazy expand
      if (prim.children.length && !row.dataset.expanded) {
        row.dataset.expanded = '1';
        row.querySelector('.prim-toggle').textContent = '▾';
        const d2 = await api(`/api/prims?path=${encodeURIComponent(prim.path)}`);
        if (d2.children) renderPrimRows(container, d2.children, depth + 1);
      }
    });

    container.appendChild(row);
  });
}

function primIcon(type) {
  const m = {
    Mesh:'⬡', Xform:'⊕', Scope:'▢', Camera:'🎥',
    SphereLight:'💡', DomeLight:'💡', RectLight:'💡',
    Material:'🎨', Shader:'🔷', BasisCurves:'〜', Points:'·',
  };
  return m[type] || '◦';
}

// ── Properties ────────────────────────────────────────────────────────────
async function selectPrimByPath(path) {
  document.querySelectorAll('.prim-row').forEach(r => {
    r.classList.toggle('selected', r.dataset.path === path);
  });

  const key = path.replace(/^\//, '');
  if (!key) return;
  const d = await api(`/api/prim/${key}`);
  if (!d.path) return;

  document.getElementById('prim-info').innerHTML =
    `<b>${d.name}</b>&nbsp;<span style="color:var(--text2)">${d.type || ''}</span><br/>`
    + `<span style="color:var(--text2);font-size:10px">${d.path}</span>`;

  const tbody = document.getElementById('attr-body');
  tbody.innerHTML = '';
  (d.attributes || []).forEach(attr => {
    const tr = document.createElement('tr');
    const td1 = document.createElement('td');
    const td2 = document.createElement('td');
    td1.textContent = attr.name;
    td2.textContent = attr.value ?? '—';
    td2.title       = attr.type;
    td2.classList.add('attr-editable');
    td2.addEventListener('dblclick', () => startAttrEdit(td2, d.path, attr));
    tr.append(td1, td2);
    tbody.appendChild(tr);
  });
}
window.selectPrimByPath = selectPrimByPath;

function startAttrEdit(cell, primPath, attr) {
  const orig = cell.textContent;
  cell.innerHTML = '';
  const inp = document.createElement('input');
  inp.type = 'text'; inp.className = 'attr-input'; inp.value = orig;
  cell.appendChild(inp);
  inp.focus(); inp.select();

  const commit = async () => {
    const raw = inp.value.trim();
    cell.textContent = raw;
    let val = raw;
    try { val = JSON.parse(raw); } catch (_) {}
    const res = await api(`/api/prim/${primPath.replace(/^\//, '')}`, 'PATCH',
                          { attribute: attr.name, value: val });
    if (!res.ok) { cell.textContent = orig; setStatus('Set failed', true); }
  };
  inp.addEventListener('blur',    commit);
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter')  inp.blur();
    if (e.key === 'Escape') cell.textContent = orig;
  });
}

// ── Script editor ──────────────────────────────────────────────────────────
function toggleScript() {
  document.getElementById('script-panel').classList.toggle('open');
}
function clearScript() {
  document.getElementById('script-editor').value = '';
  document.getElementById('script-output').textContent = '';
}
async function runScript() {
  const code = document.getElementById('script-editor').value;
  const out  = document.getElementById('script-output');
  out.textContent = 'Running…';
  const res = await api('/api/execute', 'POST', { code });
  out.textContent = (res.output || '') + (res.error ? '\n' + res.error : '');
  out.scrollTop = out.scrollHeight;
}
window.toggleScript = toggleScript;
window.clearScript  = clearScript;
window.runScript    = runScript;

// ── Status bar ────────────────────────────────────────────────────────────
function setStatus(msg, error = false) {
  const el = document.getElementById('status-msg');
  el.textContent  = msg;
  el.style.color  = error ? 'var(--danger)' : 'var(--text2)';
}
window.setStatus = setStatus;

// ── Init ──────────────────────────────────────────────────────────────────
(async () => {
  connectWS();

  const h = await api('/health');
  if (h.opendcc) {
    setStatus('OpenDCC ready.');
  } else if (h.usd_wasm_found === false) {
    setStatus('⚠ usd-wasm missing – viewport will not render', true);
  } else {
    setStatus('Running in stub mode (no OpenDCC core).');
  }

  const info = await api('/api/stage/info');
  if (info.stage) {
    document.getElementById('stage-label').textContent =
      info.stage.identifier || '[stage]';
    refreshPrims();
  }
})();
</script>
